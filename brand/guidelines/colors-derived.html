<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--av-font-text);font-weight:var(--av-weight-regular);letter-spacing:var(--av-track-text);color:var(--av-navy);background:var(--av-blanco)}
  .wrap{padding:20px 24px;box-sizing:border-box}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1;min-width:120px;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:10px;box-sizing:border-box;border:1px solid var(--av-line)}
  .sw b{font-family:var(--av-font-display);font-weight:700;font-size:14px;letter-spacing:var(--av-track-title)}
  .sw span{font-size:11px;margin-top:3px}
  .cell{flex:1;min-width:140px;height:120px;display:grid;place-items:center;border:1px solid var(--av-line);position:relative;overflow:hidden}
  .cell img{width:72%;max-height:62%;object-fit:contain}
  .cap{font-size:11px;margin-top:6px}
  .t{font-family:var(--av-font-display);font-weight:700;letter-spacing:var(--av-track-title);line-height:1.1;margin:0 0 8px}
  .meta{font-size:11px;font-weight:600;color:var(--av-purple);margin-top:10px}
</style></head><body><div class="wrap">
<div class="row"><div class="sw" style="background:var(--av-line);color:var(--av-navy)"><b>Filete</b><span>#CDD7E5 · navy al 16 %</span></div><div class="sw" style="background:var(--av-line-inverse);color:var(--av-hielo)"><b>Filete inverso</b><span>#4A608E</span></div><div class="sw" style="background:var(--av-navy-hover);color:var(--av-hielo)"><b>Navy hover</b><span>#011646</span></div><div class="sw" style="background:var(--av-placeholder);color:var(--av-blanco)"><b>Placeholder</b><span>#62769E</span></div><div class="sw" style="background:var(--av-tinta);color:var(--av-hielo)"><b>Tinta</b><span>#1D1D1B · medido en logos</span></div></div><div class="meta">Tinta no está en el PDF: es el color de los logotipos «negros» con tagline. Pendiente de confirmar.</div>
</div></body></html>
