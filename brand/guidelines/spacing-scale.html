<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--av-font-text);font-weight:var(--av-weight-regular);letter-spacing:var(--av-track-text);color:var(--av-navy);background:var(--av-blanco)}
  .wrap{padding:20px 24px;box-sizing:border-box}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1;min-width:120px;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:10px;box-sizing:border-box;border:1px solid var(--av-line)}
  .sw b{font-family:var(--av-font-display);font-weight:700;font-size:14px;letter-spacing:var(--av-track-title)}
  .sw span{font-size:11px;margin-top:3px}
  .cell{flex:1;min-width:140px;height:120px;display:grid;place-items:center;border:1px solid var(--av-line);position:relative;overflow:hidden}
  .cell img{width:72%;max-height:62%;object-fit:contain}
  .cap{font-size:11px;margin-top:6px}
  .t{font-family:var(--av-font-display);font-weight:700;letter-spacing:var(--av-track-title);line-height:1.1;margin:0 0 8px}
  .meta{font-size:11px;font-weight:600;color:var(--av-purple);margin-top:10px}
</style></head><body><div class="wrap">
<div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap"><div style="display:grid;gap:8px;justify-items:center;font-size:11px"><i style="display:block;background:var(--av-navy);width:min(var(--av-space-1),96px);height:var(--av-space-1)"></i>8</div><div style="display:grid;gap:8px;justify-items:center;font-size:11px"><i style="display:block;background:var(--av-navy);width:min(var(--av-space-2),96px);height:var(--av-space-2)"></i>16</div><div style="display:grid;gap:8px;justify-items:center;font-size:11px"><i style="display:block;background:var(--av-navy);width:min(var(--av-space-3),96px);height:var(--av-space-3)"></i>24</div><div style="display:grid;gap:8px;justify-items:center;font-size:11px"><i style="display:block;background:var(--av-navy);width:min(var(--av-space-4),96px);height:var(--av-space-4)"></i>32</div><div style="display:grid;gap:8px;justify-items:center;font-size:11px"><i style="display:block;background:var(--av-navy);width:min(var(--av-space-5),96px);height:var(--av-space-5)"></i>48</div><div style="display:grid;gap:8px;justify-items:center;font-size:11px"><i style="display:block;background:var(--av-navy);width:min(var(--av-space-6),96px);height:var(--av-space-6)"></i>64</div><div style="display:grid;gap:8px;justify-items:center;font-size:11px"><i style="display:block;background:var(--av-navy);width:min(var(--av-space-7),96px);height:var(--av-space-7)"></i>96</div><div style="display:grid;gap:8px;justify-items:center;font-size:11px"><i style="display:block;background:var(--av-navy);width:min(var(--av-space-8),96px);height:var(--av-space-8)"></i>128</div></div><div class="meta">--av-space-1 a --av-space-8 · ancho máximo de contenido 1200 px</div>
</div></body></html>
