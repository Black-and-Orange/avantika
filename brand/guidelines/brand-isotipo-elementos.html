<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--av-font-text);font-weight:var(--av-weight-regular);letter-spacing:var(--av-track-text);color:var(--av-navy);background:var(--av-blanco)}
  .wrap{padding:20px 24px;box-sizing:border-box}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1;min-width:120px;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:10px;box-sizing:border-box;border:1px solid var(--av-line)}
  .sw b{font-family:var(--av-font-display);font-weight:700;font-size:14px;letter-spacing:var(--av-track-title)}
  .sw span{font-size:11px;margin-top:3px}
  .cell{flex:1;min-width:140px;height:120px;display:grid;place-items:center;border:1px solid var(--av-line);position:relative;overflow:hidden}
  .cell img{width:72%;max-height:62%;object-fit:contain}
  .cap{font-size:11px;margin-top:6px}
  .t{font-family:var(--av-font-display);font-weight:700;letter-spacing:var(--av-track-title);line-height:1.1;margin:0 0 8px}
  .meta{font-size:11px;font-weight:600;color:var(--av-purple);margin-top:10px}
</style></head><body><div class="wrap">
<div class="row"><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-navy)"><img src="../ui_kits/revision/img/logos/isotipo-avantika-blanco.png" alt="" style="width:34%"></div><div class="cap">Isotipo · solo existe en blanco</div></div><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-hielo)"><img src="../assets/elementos/triangulo.svg" alt="" style=""></div><div class="cap">Triángulo</div></div><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-hielo) url(../assets/elementos/patron.png) center/220px auto"></div><div class="cap">Patrón · PNG</div></div></div><div class="row" style="margin-top:12px"><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-hielo)"><img src="../assets/elementos/ventana-1.svg" alt="" style="width:56%"></div><div class="cap">Ventana 1</div></div><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-hielo)"><img src="../assets/elementos/ventana-2.svg" alt="" style="width:56%"></div><div class="cap">Ventana 2</div></div><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-hielo)"><img src="../assets/elementos/ventana-3.svg" alt="" style="width:56%"></div><div class="cap">Ventana 3</div></div><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-hielo)"><img src="../assets/elementos/ventana-4.svg" alt="" style="width:56%"></div><div class="cap">Ventana 4</div></div></div><div class="meta">De la carpeta «5. Elementos visulaes». Sin documento que explique su uso.</div>
</div></body></html>
