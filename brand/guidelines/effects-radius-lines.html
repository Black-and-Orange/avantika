<!-- @dsCard group="Effects" viewport="700x200" name="Esquinas y filetes" subtitle="Propuesta BnO: esquinas rectas, radio mínimo en controles, sin sombras" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--av-font-text);font-weight:var(--av-weight-regular);letter-spacing:var(--av-track-text);color:var(--av-navy);background:var(--av-blanco)}
  .wrap{padding:20px 24px;box-sizing:border-box}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1;min-width:120px;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:10px;box-sizing:border-box;border:1px solid var(--av-line)}
  .sw b{font-family:var(--av-font-display);font-weight:700;font-size:14px;letter-spacing:var(--av-track-title)}
  .sw span{font-size:11px;margin-top:3px}
  .cell{flex:1;min-width:140px;height:120px;display:grid;place-items:center;border:1px solid var(--av-line);position:relative;overflow:hidden}
  .cell img{width:72%;max-height:62%;object-fit:contain}
  .cap{font-size:11px;margin-top:6px}
  .t{font-family:var(--av-font-display);font-weight:700;letter-spacing:var(--av-track-title);line-height:1.1;margin:0 0 8px}
  .meta{font-size:11px;font-weight:600;color:var(--av-purple);margin-top:10px}
</style></head><body><div class="wrap">
<div class="row"><div style="flex:1;min-width:140px"><div style="height:80px;border:1px solid var(--av-navy);background:var(--av-hielo);border-radius:var(--av-radius-card)"></div><div class="cap">--av-radius-card · 0</div></div><div style="flex:1;min-width:140px"><div style="height:80px;border:1px solid var(--av-navy);background:var(--av-hielo);border-radius:var(--av-radius-control)"></div><div class="cap">--av-radius-control · 4 px</div></div><div style="flex:1;min-width:140px"><div style="height:80px;display:grid;align-items:center"><hr style="width:100%;border:0;border-top:var(--av-border-hairline);margin:0"></div><div class="cap">--av-border-hairline</div></div><div style="flex:1;min-width:140px"><div style="height:80px;display:grid;align-items:center;background:var(--av-navy);padding:0 12px"><hr style="width:100%;border:0;border-top:var(--av-border-inverse);margin:0"></div><div class="cap">--av-border-inverse</div></div></div><div class="meta">Los degradados no son un efecto CSS: solo entran con los fondos entregados.</div>
</div></body></html>
