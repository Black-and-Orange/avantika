<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--av-font-text);font-weight:var(--av-weight-regular);letter-spacing:var(--av-track-text);color:var(--av-navy);background:var(--av-blanco)}
  .wrap{padding:20px 24px;box-sizing:border-box}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1;min-width:120px;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:10px;box-sizing:border-box;border:1px solid var(--av-line)}
  .sw b{font-family:var(--av-font-display);font-weight:700;font-size:14px;letter-spacing:var(--av-track-title)}
  .sw span{font-size:11px;margin-top:3px}
  .cell{flex:1;min-width:140px;height:120px;display:grid;place-items:center;border:1px solid var(--av-line);position:relative;overflow:hidden}
  .cell img{width:72%;max-height:62%;object-fit:contain}
  .cap{font-size:11px;margin-top:6px}
  .t{font-family:var(--av-font-display);font-weight:700;letter-spacing:var(--av-track-title);line-height:1.1;margin:0 0 8px}
  .meta{font-size:11px;font-weight:600;color:var(--av-purple);margin-top:10px}
  .cell{outline:2px dashed #9aa0a8;outline-offset:-2px}
</style></head><body><div class="wrap">
<div class="row"><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-hielo)"><img src="../ui_kits/revision/img/logos/logo-avantika-tagline-negro-azul.png" alt="" style=""></div><div class="cap">Tagline cian sobre claro · 1.33:1</div></div><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-cyan)"><img src="../ui_kits/revision/img/logos/logo-avantika-blanco.png" alt="" style=""></div><div class="cap">Blanco sobre cian · desaparece</div></div><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-navy)"><img src="../ui_kits/revision/img/logos/logo-avantika-negro.png" alt="" style=""></div><div class="cap">Negro sobre navy · no se lee</div></div></div><div class="row" style="margin-top:12px"><div style="flex:1;min-width:140px"><div class="cell" style="background:var(--av-hielo)"><img src="../ui_kits/revision/img/logos/logo-avantika-negro.png" alt="" style="transform:scaleY(1.9)"></div><div class="cap">Deformado</div></div><div style="flex:1;min-width:140px"><div class="cell"><img src="../assets/imagery-layout-03.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover"><img src="../ui_kits/revision/img/logos/logo-avantika-blanco.png" alt="" style="position:relative"></div><div class="cap">Sobre una zona clara de un fondo</div></div><div style="flex:1;min-width:140px"><div class="cell"><img src="../assets/imagery-post-linkedin-01.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;object-position:0 3%"></div><div class="cap">Recompuesto con otro isotipo, como en LinkedIn</div></div></div>
</div></body></html>
