<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{font-family:var(--av-font-text);font-weight:var(--av-weight-regular);letter-spacing:var(--av-track-text);color:var(--av-navy);background:var(--av-blanco)}
  .wrap{padding:20px 24px;box-sizing:border-box}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .sw{flex:1;min-width:120px;display:flex;flex-direction:column;justify-content:flex-end;height:104px;padding:10px;box-sizing:border-box;border:1px solid var(--av-line)}
  .sw b{font-family:var(--av-font-display);font-weight:700;font-size:14px;letter-spacing:var(--av-track-title)}
  .sw span{font-size:11px;margin-top:3px}
  .cell{flex:1;min-width:140px;height:120px;display:grid;place-items:center;border:1px solid var(--av-line);position:relative;overflow:hidden}
  .cell img{width:72%;max-height:62%;object-fit:contain}
  .cap{font-size:11px;margin-top:6px}
  .t{font-family:var(--av-font-display);font-weight:700;letter-spacing:var(--av-track-title);line-height:1.1;margin:0 0 8px}
  .meta{font-size:11px;font-weight:600;color:var(--av-purple);margin-top:10px}
</style></head><body><div class="wrap">
<div class="row"><div style="flex:1;min-width:140px"><img src="../assets/imagery-layout-12.jpg" alt="" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover"><div class="cap">Fondo 12 · ventana sobre navy</div></div><div style="flex:1;min-width:140px"><img src="../assets/imagery-layout-01.jpg" alt="" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover"><div class="cap">Fondo 01 · triángulo translúcido</div></div><div style="flex:1;min-width:140px"><img src="../assets/imagery-layout-08.jpg" alt="" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover"><div class="cap">Fondo 08 · isotipo púrpura sobre negro</div></div></div><div class="row" style="margin-top:12px"><div style="flex:1;min-width:140px"><img src="../assets/imagery-layout-05.jpg" alt="" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover"><div class="cap">Fondo 05 · franja diagonal</div></div><div style="flex:1;min-width:140px"><img src="../assets/imagery-mockup-banner.jpg" alt="" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover"><div class="cap">Aplicación · banner</div></div><div style="flex:1;min-width:140px"><img src="../assets/imagery-mockup-carpeta.jpg" alt="" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover"><div class="cap">Aplicación · carpetas</div></div></div><div class="meta">El texto no va sobre los fondos (propuesta BnO). Los degradados solo entran con estos archivos.</div>
</div></body></html>
